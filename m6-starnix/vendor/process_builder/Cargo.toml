[package]
name = "m6-process-builder-shim"
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"
description = "Minimal no_std process_builder::elf_load shim for the M6 Starnix fork"

[lib]
name = "process_builder"
path = "src/lib.rs"

[dependencies]
zx = { package = "m6-zx-shim", path = "../../../m6-zx-shim" }
elf_parse = { package = "m6-starnix-elf-parse", path = "../../../m6-starnix-elf-parse" }
