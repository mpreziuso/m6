[package]
name = "m6-syncio-shim"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Minimal syncio (zxio) type shim for the M6 Starnix fork"

[lib]
name = "syncio"
path = "src/lib.rs"

[dependencies]
bitflags = "2"
zx = { package = "m6-zx-shim", path = "../../../m6-zx-shim" }
