[workspace]
resolver = "3"
members = ["m6-alloc", "m6-arch", "m6-boot", "m6-cap", "m6-common", "m6-crypto", "m6-kernel", "m6-linux-uapi", "m6-mmio", "m6-paging", "m6-pal", "m6-std", "m6-starnix", "m6-starnix-atomic-bitflags", "m6-starnix-crypt", "m6-starnix-ext", "m6-starnix-expando", "m6-starnix-extended-pstate", "m6-starnix-elf-parse", "m6-starnix-filter-methods-macro", "m6-starnix-flyweights", "m6-fuchsia-rcu", "m6-fuchsia-rcu-collections", "m6-starnix-lifecycle", "m6-starnix-line-discipline", "m6-starnix-mapped-clock", "m6-starnix-memory-pinning", "m6-starnix-page-buf", "m6-starnix-range-map", "m6-starnix-rcu", "m6-starnix-registers", "m6-starnix-split-enum-storage", "m6-starnix-split-enum-storage/macro", "m6-starnix-time-pretty", "m6-starnix-usercopy", "m6-starnix-logging", "m6-starnix-stack", "m6-starnix-std", "m6-starnix-syscalls", "m6-starnix-sync", "m6-starnix-sync/lock_ordering_macro", "m6-starnix-task-command", "m6-starnix-types", "m6-starnix-uapi", "m6-syscall", "m6-system", "m6-testlib", "m6-user", "m6-zx-shim"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Michele Preziuso"]
license = "MIT"
repository = "https://github.com/mpreziuso/m6"

[workspace.dependencies]
m6-common = { path = "m6-common" }
m6-paging = { path = "m6-paging" }
m6-arch = { path = "m6-arch" }
m6-pal = { path = "m6-pal" }
m6-cap = { path = "m6-cap" }
m6-syscall = { path = "m6-syscall" }

# ELF parsing
elf_rs = { version = "0.3", default-features = false }

# External dependencies
aarch64-cpu = "11.2.0"
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
heapless = { version = "0.8", default-features = false }
arm-gic = "0.7"
spin = { version = "0.10", default-features = false, features = [
    "mutex",
    "spin_mutex",
    "rwlock",
    "once",
    "lock_api",
] }
lock_api = { version = "0.4", default-features = false }
static_assertions = "1"
thingbuf = { version = "0.1", default-features = false, features = ["static"] }
log = "0.4"
tock-registers = "0.10"
once_cell_no_std = "0.1"
buddy_system_allocator = "0.12"
bitflags = "2"
hashbrown = { version = "0.15", default-features = false, features = ["allocator-api2"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "z"
